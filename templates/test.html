<!DOCTYPE html>
<html>
<head>
    <title>Smart Lost and Found</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial,sans-serif;
        }

        body{
            background:linear-gradient(135deg,#4facfe,#00f2fe);
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }

        .container{
            background:white;
            width:500px;
            padding:35px;
            border-radius:20px;
            box-shadow:0 10px 30px rgba(0,0,0,0.2);
            text-align:center;
        }

        h1{
            color:#007bff;
            margin-bottom:10px;
            font-size:34px;
        }

        p{
            color:#555;
            margin-bottom:25px;
        }

        input, textarea{
            width:100%;
            padding:14px;
            margin:10px 0;
            border:1px solid #ccc;
            border-radius:10px;
            font-size:16px;
        }

        input[type=file]{
            border:none;
        }

        button{
            width:100%;
            padding:15px;
            background:#28a745;
            color:white;
            border:none;
            border-radius:30px;
            font-size:18px;
            font-weight:bold;
            cursor:pointer;
            transition:.3s;
        }

        button:hover{
            background:#218838;
            transform:scale(1.03);
        }
    </style>

</head>

<body>

<div class="container">

    <h1>🔍 Smart Lost & Found</h1>
    <p>Upload an image and identify the lost item using AI.</p>

    <form action="/upload" method="POST" enctype="multipart/form-data">

        <input type="text" name="item_name" placeholder="Enter Item Name" required>

        <textarea name="description" rows="4" placeholder="Enter Description" required></textarea>

        <label>Lost Date:</label>
        <input type="date" name="lost_date" required>

        <label>Location:</label>
        <input type="text" name="location" required>

        <label>Contact Number:</label>
        <input type="text" name="contact" required>

        <label>Upload Image:</label>
        <input type="file" name="image" required>
        
        <br><br>

        <button type="submit">📤 Upload & Predict</button>

    </form>

</div>

</body>
</html>
