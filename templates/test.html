<!DOCTYPE html>
<html>
<head>
    <title>Smart Lost and Found</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, sans-serif;
        }

        body{
            background:linear-gradient(135deg,#4facfe,#00f2fe);
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
        }

        .container{
            background:white;
            width:500px;
            padding:45px 35px;
            border-radius:25px;
            box-shadow:0 10px 30px rgba(0,0,0,0.2);
            text-align:center;
        }

        h1{
            color:#007bff;
            margin-bottom:15px;
            font-size:34px;
        }

        .subtitle{
            color:#555;
            margin-bottom:35px;
            font-size:17px;
        }

        h2{
            color:#333;
            margin-bottom:25px;
        }

        .menu-button{
            display:block;
            width:100%;
            padding:18px;
            margin:18px 0;
            border:none;
            border-radius:15px;
            color:white;
            font-size:20px;
            font-weight:bold;
            cursor:pointer;
            text-decoration:none;
            transition:0.3s;
        }

        .lost{
            background:#e74c3c;
        }

        .found{
            background:#28a745;
        }

        .menu-button:hover{
            transform:scale(1.03);
            box-shadow:0 8px 20px rgba(0,0,0,0.2);
        }

        .info{
            margin-top:25px;
            color:#777;
            font-size:14px;
        }
    </style>

</head>

<body>

<div class="container">

    <h1>🔍 Smart Lost & Found</h1>

    <p class="subtitle">
        AI-Based Lost and Found Management System
    </p>

    <h2>What do you want to do?</h2>

    <!-- LOST ITEM -->
    <a href="/" class="menu-button lost"
       onclick="openLost(event)">
        🔴 LOST ITEM
    </a>

    <!-- FOUND ITEM -->
    <a href="/found" class="menu-button found">
        🟢 FOUND ITEM
    </a>

    <p class="info">
        Select an option to register your lost or found item.
    </p>

</div>


<script>

function openLost(event){

    event.preventDefault();

    window.location.href = "/lost";

}

</script>

</body>
</html>
