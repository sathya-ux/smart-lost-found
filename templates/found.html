<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Found Item Upload</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:linear-gradient(135deg,#74ebd5,#9face6);
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

.container{
    width:420px;
    background:#fff;
    padding:30px;
    border-radius:15px;
    box-shadow:0 10px 25px rgba(0,0,0,0.2);
}

h2{
    text-align:center;
    color:#333;
    margin-bottom:20px;
}

label{
    font-weight:bold;
    color:#555;
}

input,textarea{
    width:100%;
    padding:10px;
    margin-top:5px;
    margin-bottom:15px;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:15px;
}

textarea{
    resize:none;
    height:80px;
}

button{
    width:100%;
    padding:12px;
    background:#4CAF50;
    color:white;
    border:none;
    border-radius:8px;
    font-size:16px;
    cursor:pointer;
}

button:hover{
    background:#45a049;
}

.back{
    display:block;
    text-align:center;
    margin-top:15px;
    text-decoration:none;
    color:#007BFF;
    font-weight:bold;
}

.back:hover{
    text-decoration:underline;
}
</style>

</head>

<body>

<div class="container">

<h2>📦 Found Item Upload</h2>

<form action="/found_upload" method="POST" enctype="multipart/form-data">

<label>Item Name</label>
<input type="text" name="item_name" required>

<label>Description</label>
<textarea name="description" required></textarea>

<label>Found Date</label>
<input type="date" name="found_date" required>

<label>Location</label>
<input type="text" name="location" required>

<label>Contact Number</label>
<input type="text" name="contact" required>

<label>Upload Image</label>
<input type="file" name="image" accept="image/*" required>

<button type="submit">Upload Found Item</button>

</form>

<a href="/" class="back">⬅ Back to Home</a>

</div>

</body>
</html>
